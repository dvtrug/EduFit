<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Connection backend flow</title>
  <desc id="desc">Parent or Student invite, recipient accepts to create a link, then Student or linked Parent requests Tutor, and Tutor accepts to create a class.</desc>
  <rect width="1100" height="360" fill="#f7f9fa"/>
  <text x="34" y="44" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b34">Connection: từ lời mời đến lớp học</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#172b34">
    <rect x="34" y="90" width="220" height="170" rx="6" fill="#e6f3f0" stroke="#267b6c" stroke-width="2"/>
    <text x="54" y="124" font-weight="700">1. Lời mời</text><text x="54" y="158">Student / Parent gửi</text><text x="54" y="186">PENDING → ACCEPTED</text><text x="54" y="214">TTL 14 ngày</text>
    <rect x="299" y="90" width="220" height="170" rx="6" fill="#e7edf8" stroke="#3e68a2" stroke-width="2"/>
    <text x="319" y="124" font-weight="700">2. Liên kết</text><text x="319" y="158">Parent + Student</text><text x="319" y="186">CONFIRMED</text><text x="319" y="214">REVOKED cắt quyền</text>
    <rect x="564" y="90" width="220" height="170" rx="6" fill="#fff2df" stroke="#b37a22" stroke-width="2"/>
    <text x="584" y="124" font-weight="700">3. Yêu cầu Tutor</text><text x="584" y="158">Student / linked Parent</text><text x="584" y="186">PENDING → ACCEPTED</text><text x="584" y="214">TTL 7 ngày</text>
    <rect x="829" y="90" width="237" height="170" rx="6" fill="#f1e9f6" stroke="#836098" stroke-width="2"/>
    <text x="849" y="124" font-weight="700">4. Class</text><text x="849" y="158">Tutor chấp nhận</text><text x="849" y="186">ACTIVE</text><text x="849" y="214">1 Student + 1 Tutor</text>
  </g>
  <g fill="none" stroke="#53636b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M259 175h29m-8-8 8 8-8 8"/><path d="M524 175h29m-8-8 8 8-8 8"/><path d="M789 175h29m-8-8 8 8-8 8"/>
  </g>
  <text x="34" y="308" font-family="Arial,sans-serif" font-size="14" fill="#53636b">Mỗi chuyển trạng thái được kiểm tra quyền và khóa giao dịch; accept + bản ghi kế tiếp cùng một transaction.</text>
</svg>
