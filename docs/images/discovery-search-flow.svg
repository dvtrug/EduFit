<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc">
  <title id="title">Discovery search and detail hydration</title>
  <desc id="desc">Search pages summaries and counts before batch hydration with three additional queries. Detail uses three queries. DTOs leave transactions fully hydrated without OSIV.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40656b"/></marker>
    <style>.bg{fill:#f7fafb}.box{fill:white;stroke:#9aafb6;stroke-width:2}.web{fill:#e8f5ef;stroke:#419b73}.db{fill:#fff4df;stroke:#b7934c}.edge{fill:none;stroke:#40656b;stroke-width:2.5;marker-end:url(#arrow)}.title{font:700 29px Arial;fill:#173d43}.label{font:700 21px Arial;fill:#173d43}.text{font:18px Arial;fill:#365860}</style>
  </defs>
  <rect class="bg" width="1400" height="1010"/>
  <text class="title" x="50" y="50">Search and detail | Hydrate in batches, serialize detached DTOs</text>
  <text class="text" x="50" y="83">GET routes are public. Profile owns queries; Discovery maps the HTTP response.</text>
  <path class="edge" d="M355 225 V275"/><path class="edge" d="M355 380 V430"/><path class="edge" d="M355 535 V585"/><path class="edge" d="M355 715 V765"/>
  <path class="edge" d="M1045 225 V275"/><path class="edge" d="M1045 380 V430"/><path class="edge" d="M1045 535 V585"/><path class="edge" d="M1045 715 V765"/>
  <rect class="box web" x="70" y="125" width="570" height="100" rx="6"/>
  <text class="label" x="95" y="160">1. GET /api/v1/discovery/tutors</text>
  <text class="text" x="95" y="188">Validate filters; clamp page/size; whitelist sort</text>
  <text class="text" x="95" y="213">Controller maps request to TutorSearchCriteria</text>
  <rect class="box" x="70" y="275" width="570" height="105" rx="6"/>
  <text class="label" x="95" y="310">2. DiscoveryQueryService.searchTutors()</text>
  <text class="text" x="95" y="339">Begin read-only transaction</text>
  <text class="text" x="95" y="365">ProfileFacade.searchTutors(criteria, pageable)</text>
  <rect class="box db" x="70" y="430" width="570" height="105" rx="6"/>
  <text class="label" x="95" y="465">3. Page VERIFIED tutor summaries + count</text>
  <text class="text" x="95" y="494">SQL EXISTS filters avoid duplicate tutor rows</text>
  <text class="text" x="95" y="520">Page IDs retained in requested search order</text>
  <rect class="box db" x="70" y="585" width="570" height="130" rx="6"/>
  <text class="label" x="95" y="620">4. findVerifiedTutorDetails(pageIds)</text>
  <text class="text" x="95" y="649">Batch tutor rows + subject projection + slots</text>
  <text class="text" x="95" y="675">Map DTOs by tutorId; retain original Page metadata</text>
  <text class="text" x="95" y="701">Missing detail: keep summary, empty associations</text>
  <rect class="box web" x="70" y="765" width="570" height="105" rx="6"/>
  <text class="label" x="95" y="800">5. Transaction ends; controller maps cards</text>
  <text class="text" x="95" y="829">ApiResponse&lt;Page&lt;TutorDiscoveryCardResponse&gt;&gt;</text>
  <text class="text" x="95" y="855">Five queries when count and hydration are needed</text>
  <rect class="box web" x="760" y="125" width="570" height="100" rx="6"/>
  <text class="label" x="785" y="160">1. GET /api/v1/discovery/tutors/{tutorId}</text>
  <text class="text" x="785" y="188">Bind UUID path variable</text>
  <text class="text" x="785" y="213">DiscoveryQueryService.getTutorDetail(tutorId)</text>
  <rect class="box" x="760" y="275" width="570" height="105" rx="6"/>
  <text class="label" x="785" y="310">2. Read-only transaction</text>
  <text class="text" x="785" y="339">ProfileFacade.findVerifiedTutorDetail(tutorId)</text>
  <text class="text" x="785" y="365">Read tutor and require status VERIFIED</text>
  <rect class="box db" x="760" y="430" width="570" height="105" rx="6"/>
  <text class="label" x="785" y="465">3. Found: hydrate subjects and slots</text>
  <text class="text" x="785" y="494">Three queries total for a verified tutor</text>
  <text class="text" x="785" y="520">Missing / unverified: RESOURCE_NOT_FOUND (404)</text>
  <rect class="box" x="760" y="585" width="570" height="130" rx="6"/>
  <text class="label" x="785" y="620">4. Return TutorDiscoveryProfileDto</text>
  <text class="text" x="785" y="649">Profile-owned read model, not a JPA entity</text>
  <text class="text" x="785" y="675">Full bio, teaching method, subjects, availabilitySlots</text>
  <text class="text" x="785" y="701">Transaction ends before response serialization</text>
  <rect class="box web" x="760" y="765" width="570" height="105" rx="6"/>
  <text class="label" x="785" y="800">5. Controller maps TutorDetailResponse</text>
  <text class="text" x="785" y="829">ApiResponse&lt;TutorDetailResponse&gt;</text>
  <text class="text" x="785" y="855">No contact details or booking calendar</text>
  <text class="text" x="70" y="923">OSIV is false: associations are complete outside the service transaction; no per-tutor SQL during mapping.</text>
  <text class="text" x="70" y="953">Empty first search page: one query. Counts are evidence from PostgreSQL fixtures, not all possible request shapes.</text>
  <text class="text" x="70" y="983">Search tie ordering and concurrent changes are not snapshot guarantees. Matching uses a separate bounded query.</text>
</svg>
