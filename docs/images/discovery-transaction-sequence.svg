<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Discovery matching transaction sequence</title>
  <desc id="desc">Caller enters transactional matching service, which reads public APIs, ranks and explains, saves the log and publishes the event. AFTER_COMMIT consumer waits for transaction commit; rollback suppresses it. Event delivery is in-process only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40656b"/></marker>
    <style>.bg{fill:#f7fafb}.box{fill:white;stroke:#9aafb6;stroke-width:2}.lane{stroke:#a7b9bf;stroke-width:1.5;stroke-dasharray:7 6}.edge{fill:none;stroke:#40656b;stroke-width:2.5;marker-end:url(#arrow)}.reply{stroke-dasharray:7 5}.title{font:700 29px Arial;fill:#173d43}.label{font:700 19px Arial;fill:#173d43}.text{font:18px Arial;fill:#365860}.note{fill:#fff4df;stroke:#b7934c;stroke-width:1.5}</style>
  </defs>
  <rect class="bg" width="1400" height="1040"/>
  <text class="title" x="50" y="50">Matching transaction | Publishing is not proof of commit</text>
  <text class="text" x="50" y="83">REQUIRED propagation. This depicts the successful path; caller may own an outer transaction.</text>
  <path class="lane" d="M160 180 V810 M460 180 V810 M790 180 V810 M1090 180 V810 M1280 180 V810"/>
  <rect class="box" x="50" y="120" width="220" height="60" rx="6"/><text class="label" x="160" y="156" text-anchor="middle">Controller / Facade</text>
  <rect class="box" x="330" y="120" width="260" height="60" rx="6"/><text class="label" x="460" y="156" text-anchor="middle">Matching service + tx</text>
  <rect class="box" x="660" y="120" width="260" height="60" rx="6"/><text class="label" x="790" y="156" text-anchor="middle">Public APIs / scorer / AI</text>
  <rect class="box" x="975" y="120" width="230" height="60" rx="6"/><text class="label" x="1090" y="156" text-anchor="middle">Repository / DB</text>
  <rect class="box" x="1220" y="120" width="120" height="60" rx="6"/><text class="label" x="1280" y="156" text-anchor="middle">Consumer</text>
  <path class="edge" d="M160 240 H460"/><text class="text" x="175" y="225">match(actor, goalId, topN)</text>
  <path class="edge" d="M460 320 H790"/><text class="text" x="477" y="305">Authorize, load, rank, explain</text>
  <path class="edge reply" d="M790 385 H460"/><text class="text" x="477" y="370">Ranked result DTOs / fallback</text>
  <path class="edge" d="M460 460 H1090"/><text class="text" x="477" y="445">save(MatchingRunLogEntity): not necessarily flushed yet</text>
  <rect class="note" x="350" y="500" width="810" height="83" rx="6"/>
  <text class="label" x="370" y="530">publishEvent(MatchingExecutedEvent) inside transaction</text>
  <text class="text" x="370" y="557">AFTER_COMMIT listener waits; a plain EventListener can run immediately.</text>
  <path class="edge" d="M460 630 H1090"/><text class="text" x="477" y="615">Flush + COMMIT (or wait for outer caller transaction)</text>
  <path class="edge" d="M460 710 H1280"/><text class="text" x="477" y="695">Only after successful commit: transactional listener may handle event</text>
  <path class="edge reply" d="M460 790 H160"/><text class="text" x="175" y="775">Return / map response</text>
  <rect class="note" x="50" y="850" width="1290" height="145" rx="6"/>
  <text class="label" x="75" y="885">Rollback / failure path</text>
  <text class="text" x="75" y="915">Validation denial happens before log/event. Save/flush/FK failure rolls back the run; AFTER_COMMIT is not invoked.</text>
  <text class="text" x="75" y="945">With an outer transaction, service return can precede outer COMMIT; the listener still waits for the actual commit.</text>
  <text class="text" x="75" y="975">Consumer is an integration point, not a shipped Discovery listener. No durable outbox, retry or crash delivery guarantee.</text>
</svg>
