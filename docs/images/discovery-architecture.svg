<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Discovery package and module dependencies</title>
  <desc id="desc">HTTP controller and Java facade share matching orchestration. Discovery uses Profile, Connection and AI public APIs, a pure Java scorer and its own log and execution event.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40656b"/></marker>
    <style>.bg{fill:#f7fafb}.box{fill:white;stroke:#9aafb6;stroke-width:2}.entry{fill:#e8f5ef;stroke:#419b73}.domain{fill:#eaf0fc;stroke:#6383bf}.external{fill:#fff4df;stroke:#b7934c}.data{fill:#f0ecf8;stroke:#967db6}.edge{fill:none;stroke:#40656b;stroke-width:2.5;marker-end:url(#arrow)}.title{font:700 29px Arial;fill:#173d43}.label{font:700 21px Arial;fill:#173d43}.text{font:18px Arial;fill:#365860}.note{font:17px Arial;fill:#365860}</style>
  </defs>
  <rect class="bg" width="1400" height="1000"/>
  <text class="title" x="50" y="50">Discovery | Packages and dependency boundaries</text>
  <text class="text" x="50" y="83">Current implementation after T14. Arrows mean calls / dependencies, not event delivery guarantees.</text>
  <path class="edge" d="M260 170 V215"/><path class="edge" d="M1040 170 V215"/>
  <path class="edge" d="M260 310 V370"/><path class="edge" d="M440 265 H540 V410 H600"/>
  <path class="edge" d="M1040 310 V370"/>
  <path class="edge" d="M260 475 V590"/>
  <path class="edge" d="M600 430 H480 V638 H440"/>
  <path class="edge" d="M680 475 V590"/><path class="edge" d="M1110 475 V590"/>
  <path class="edge" d="M870 475 V835 H840"/>
  <path class="edge" d="M1280 430 H1320 V835 H1280"/>
  <rect class="box entry" x="80" y="115" width="360" height="55" rx="6"/>
  <text class="label" x="100" y="150">HTTP client</text>
  <rect class="box entry" x="800" y="115" width="480" height="55" rx="6"/>
  <text class="label" x="820" y="150">Other backend module (trusted actor)</text>
  <rect class="box entry" x="80" y="215" width="360" height="95" rx="6"/>
  <text class="label" x="100" y="248">web / DiscoveryController</text>
  <text class="text" x="100" y="275">SecurityConfig: GET public</text>
  <text class="text" x="100" y="299">POST: session + CSRF</text>
  <rect class="box entry" x="800" y="215" width="480" height="95" rx="6"/>
  <text class="label" x="820" y="248">api / DiscoveryFacade</text>
  <text class="text" x="820" y="275">application / DiscoveryFacadeImpl</text>
  <text class="text" x="820" y="299">Maps results to public summary DTOs</text>
  <rect class="box" x="80" y="370" width="360" height="105" rx="6"/>
  <text class="label" x="100" y="406">DiscoveryQueryService</text>
  <text class="text" x="100" y="435">application: search / detail</text>
  <text class="text" x="100" y="460">Read-only transaction + DTO hydration</text>
  <rect class="box" x="600" y="370" width="680" height="105" rx="6"/>
  <text class="label" x="620" y="406">application / TutorMatchingService.match()</text>
  <text class="text" x="620" y="435">Shared actor/goal authorization, scoring, explanation, log and event</text>
  <text class="text" x="620" y="460">Transactional orchestration; no dependency on Discovery web DTOs</text>
  <rect class="box external" x="80" y="590" width="360" height="110" rx="6"/>
  <text class="label" x="100" y="625">profile.api / ProfileFacade</text>
  <text class="text" x="100" y="654">Tutor / goal / catalog read models</text>
  <text class="text" x="100" y="680">Profile owns its JPA and SQL queries</text>
  <rect class="box external" x="520" y="590" width="320" height="110" rx="6"/>
  <text class="label" x="540" y="625">ConnectionFacade</text>
  <text class="text" x="540" y="654">Parent link must be CONFIRMED</text>
  <text class="text" x="540" y="680">No reverse Discovery dependency</text>
  <rect class="box external" x="920" y="590" width="360" height="110" rx="6"/>
  <text class="label" x="940" y="625">MatchExplanationService</text>
  <text class="text" x="940" y="654">ai.api / AiUsageQuery + AiGateway</text>
  <text class="text" x="940" y="680">Top 1 only; deterministic fallback</text>
  <rect class="box domain" x="520" y="780" width="320" height="110" rx="6"/>
  <text class="label" x="540" y="815">domain / policy</text>
  <text class="text" x="540" y="844">MatchScorer + MatchWeights</text>
  <text class="text" x="540" y="870">Five factors; pure Java models</text>
  <rect class="box data" x="920" y="780" width="360" height="110" rx="6"/>
  <text class="label" x="940" y="815">Matching log + execution event</text>
  <text class="text" x="940" y="844">infra / MatchingRunLogRepository</text>
  <text class="text" x="940" y="870">api / event / MatchingExecutedEvent</text>
  <text class="note" x="80" y="942">ArchUnit: public API across modules; Java-only domain; application does not import web; no package cycles.</text>
  <text class="note" x="80" y="972">Profiles and links remain owned by their modules. Matching does not create a connection request or class.</text>
</svg>
