<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc backend Discovery</title>
  <desc id="desc">Client đi qua SecurityConfig và DiscoveryController. Query và Matching đọc ProfileFacade; Matching dùng MatchScorer, AI và matching_run_log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#42636b"/></marker>
    <style>
      .bg{fill:#f8fbfa}.box{fill:#fff;stroke:#adc5c4;stroke-width:2}.web{fill:#e8f4f2;stroke:#58a69b}.domain{fill:#eef3fa;stroke:#7c9cbd}.ai{fill:#fff3e8;stroke:#d8a46b}.data{fill:#f3f5f7;stroke:#91a6ad}
      .line{fill:none;stroke:#42636b;stroke-width:2.5;marker-end:url(#arrow)}.title{font:700 26px Arial,sans-serif;fill:#19383f}.label{font:700 18px Arial,sans-serif;fill:#19383f}.small{font:15px Arial,sans-serif;fill:#506a70}.lane{font:700 13px Arial,sans-serif;fill:#587d7f;letter-spacing:1px}
    </style>
  </defs>
  <rect class="bg" width="1400" height="650"/>
  <text class="title" x="40" y="48">Discovery: các lớp và ranh giới dữ liệu</text>
  <text class="lane" x="40" y="90">REQUEST</text><text class="lane" x="432" y="90">WEB</text><text class="lane" x="685" y="90">APPLICATION</text><text class="lane" x="980" y="90">DOMAIN / INFRA / EXTERNAL</text>

  <path class="line" d="M215 333 H260"/><path class="line" d="M415 333 H460"/>
  <path class="line" d="M635 333 C665 333 650 188 685 188"/>
  <path class="line" d="M635 333 C665 333 650 448 685 448"/>
  <path class="line" d="M885 188 H960"/><path class="line" d="M885 448 C930 448 915 188 960 188"/>
  <path class="line" d="M885 448 C922 448 925 313 960 313"/>
  <path class="line" d="M885 448 H960"/><path class="line" d="M885 448 C925 448 925 560 960 560"/>
  <path class="line" d="M1165 188 H1210"/><path class="line" d="M1165 448 H1210"/>

  <rect class="box web" x="40" y="295" width="175" height="76" rx="6"/><text class="label" x="127" y="328" text-anchor="middle">Client</text><text class="small" x="127" y="351" text-anchor="middle">HTTP request</text>
  <rect class="box web" x="260" y="295" width="155" height="76" rx="6"/><text class="label" x="337" y="328" text-anchor="middle">SecurityConfig</text><text class="small" x="337" y="351" text-anchor="middle">session / public</text>
  <rect class="box web" x="460" y="295" width="175" height="76" rx="6"/><text class="label" x="547" y="328" text-anchor="middle">Discovery</text><text class="small" x="547" y="351" text-anchor="middle">Controller</text>
  <rect class="box" x="685" y="150" width="200" height="76" rx="6"/><text class="label" x="785" y="183" text-anchor="middle">DiscoveryQuery</text><text class="small" x="785" y="206" text-anchor="middle">Service: search / detail</text>
  <rect class="box" x="685" y="410" width="200" height="76" rx="6"/><text class="label" x="785" y="443" text-anchor="middle">TutorMatching</text><text class="small" x="785" y="466" text-anchor="middle">Service: rank / log</text>
  <rect class="box" x="960" y="150" width="205" height="76" rx="6"/><text class="label" x="1062" y="183" text-anchor="middle">ProfileFacade</text><text class="small" x="1062" y="206" text-anchor="middle">public API</text>
  <rect class="box domain" x="960" y="275" width="205" height="76" rx="6"/><text class="label" x="1062" y="308" text-anchor="middle">MatchScorer</text><text class="small" x="1062" y="331" text-anchor="middle">Java thuần</text>
  <rect class="box ai" x="960" y="410" width="205" height="76" rx="6"/><text class="label" x="1062" y="443" text-anchor="middle">MatchExplanation</text><text class="small" x="1062" y="466" text-anchor="middle">Service</text>
  <rect class="box data" x="960" y="522" width="205" height="76" rx="6"/><text class="label" x="1062" y="555" text-anchor="middle">matching_run_log</text><text class="small" x="1062" y="578" text-anchor="middle">Discovery-owned</text>
  <rect class="box data" x="1210" y="150" width="150" height="76" rx="6"/><text class="label" x="1285" y="183" text-anchor="middle">Profile DB</text><text class="small" x="1285" y="206" text-anchor="middle">tutors / goals</text>
  <rect class="box ai" x="1210" y="410" width="150" height="76" rx="6"/><text class="label" x="1285" y="443" text-anchor="middle">AI API</text><text class="small" x="1285" y="466" text-anchor="middle">gateway / quota</text>
</svg>
