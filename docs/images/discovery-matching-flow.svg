<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc">
  <title id="title">Discovery bounded matching execution flow</title>
  <desc id="desc">Trusted actor and goal are authorized before retrieving at most 200 candidates. Pure Java five-factor scoring ranks results. Only Top 1 may call AI; successful runs save a log and publish an event in the transaction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40656b"/></marker>
    <style>.bg{fill:#f7fafb}.box{fill:white;stroke:#9aafb6;stroke-width:2}.entry{fill:#e8f5ef;stroke:#419b73}.domain{fill:#eaf0fc;stroke:#6383bf}.ai{fill:#fff4df;stroke:#b7934c}.data{fill:#f0ecf8;stroke:#967db6}.edge{fill:none;stroke:#40656b;stroke-width:2.5;marker-end:url(#arrow)}.title{font:700 29px Arial;fill:#173d43}.label{font:700 21px Arial;fill:#173d43}.text{font:18px Arial;fill:#365860}</style>
  </defs>
  <rect class="bg" width="1400" height="1240"/>
  <text class="title" x="50" y="50">Matching | Same authorized workflow for HTTP and Java facade</text>
  <text class="text" x="50" y="83">TutorMatchingService.match(actor, goalId, topN) owns the REQUIRED transaction.</text>
  <path class="edge" d="M380 220 V260"/><path class="edge" d="M380 375 V415"/><path class="edge" d="M380 515 V555"/><path class="edge" d="M380 685 V725"/><path class="edge" d="M380 855 V895"/><path class="edge" d="M380 1010 V1050"/>
  <rect class="box entry" x="70" y="125" width="620" height="95" rx="6"/>
  <text class="label" x="95" y="159">1. Trusted actor + goalId + topN</text>
  <text class="text" x="95" y="187">POST /match or DiscoveryFacade.findTopMatchesForGoal</text>
  <text class="text" x="95" y="211">Role STUDENT/PARENT; topN 1..10 (HTTP default 5)</text>
  <rect class="box" x="70" y="260" width="620" height="125" rx="6"/>
  <text class="label" x="95" y="294">2. Load goal via Profile; authorize access</text>
  <text class="text" x="95" y="322">STUDENT: actor.userId == goal.studentUserId</text>
  <text class="text" x="95" y="346">PARENT: ConnectionFacade confirmed link to studentId</text>
  <text class="text" x="95" y="370">ACTIVE goal + level + positive budget + desired slots</text>
  <rect class="box" x="70" y="415" width="620" height="100" rx="6"/>
  <text class="label" x="95" y="449">3. Build pure Java MatchCriteria</text>
  <text class="text" x="95" y="477">Get complete education-level business order once</text>
  <text class="text" x="95" y="502">Construct MatchScorer with standard weights</text>
  <rect class="box" x="70" y="555" width="620" height="130" rx="6"/>
  <text class="label" x="95" y="589">4. ProfileFacade.findVerifiedCandidatesBySubject</text>
  <text class="text" x="95" y="617">TutorCandidateCriteria(subjectId, mode, area)</text>
  <text class="text" x="95" y="642">VERIFIED + subject + compatible mode/area in SQL</text>
  <text class="text" x="95" y="667">Cap 200 by default; batch subjects/slots (3 queries)</text>
  <rect class="box domain" x="70" y="725" width="620" height="130" rx="6"/>
  <text class="label" x="95" y="759">5. Score, sort, limit topN</text>
  <text class="text" x="95" y="787">Subject 30% + level 20% + price 20%</text>
  <text class="text" x="95" y="812">+ time 15% + rating 15%; scores 0..100</text>
  <text class="text" x="95" y="837">Tie: time, reviews, registeredAt, tutorId</text>
  <rect class="box ai" x="70" y="895" width="620" height="125" rx="6"/>
  <text class="label" x="95" y="929">6. Explanation, not ranking</text>
  <text class="text" x="95" y="957">Top 1: actor quota then AiGateway, or fallback</text>
  <text class="text" x="95" y="981">Other results: ruleBased(); empty: no AI calls</text>
  <text class="text" x="95" y="1005">AI failure does not change score or result order</text>
  <rect class="box data" x="70" y="1050" width="620" height="125" rx="6"/>
  <text class="label" x="95" y="1084">7. Save matching run log, then publish event</text>
  <text class="text" x="95" y="1112">MatchingExecutedEvent with actor/student/goal/count/time</text>
  <text class="text" x="95" y="1136">Includes successful zero-result runs</text>
  <text class="text" x="95" y="1160">Commit / outer transaction controls AFTER_COMMIT</text>
  <rect class="box" x="770" y="125" width="560" height="250" rx="6"/>
  <text class="label" x="795" y="161">Early exits</text>
  <text class="text" x="795" y="196">Missing goal: 404 RESOURCE_NOT_FOUND</text>
  <text class="text" x="795" y="227">Unauthorized actor / unconfirmed Parent: 403</text>
  <text class="text" x="795" y="258">Invalid input or goal state: 400</text>
  <text class="text" x="795" y="297">No candidate retrieval, AI or run log after denial.</text>
  <text class="text" x="795" y="328">Invitation PENDING / DECLINED is not a link.</text>
  <text class="text" x="795" y="359">REVOKED link does not grant matching access.</text>
  <rect class="box domain" x="770" y="415" width="560" height="270" rx="6"/>
  <text class="label" x="795" y="451">Soft scores and candidate-cap trade-off</text>
  <text class="text" x="795" y="486">Level / price / time / rating are not hard filters.</text>
  <text class="text" x="795" y="517">Level adjacency uses catalog order, not ID math.</text>
  <text class="text" x="795" y="548">Merge weekly slot intervals before time scoring.</text>
  <text class="text" x="795" y="589">Candidate pre-order differs from match score.</text>
  <text class="text" x="795" y="620">Cap bounds hydration, not all DB scan/sort work.</text>
  <text class="text" x="795" y="651">Global Top N is not guaranteed (see T12 report).</text>
  <rect class="box ai" x="770" y="725" width="560" height="285" rx="6"/>
  <text class="label" x="795" y="761">AI safeguards and limits</text>
  <text class="text" x="795" y="796">10 MATCH_EXPLANATION requests / rolling 24h</text>
  <text class="text" x="795" y="827">Quota charged to actor, including Parent actor</text>
  <text class="text" x="795" y="858">Grounded mode/price/scores; no contact/bio PII</text>
  <text class="text" x="795" y="899">Provider wait deadline 15s, cancellation best-effort</text>
  <text class="text" x="795" y="930">Usage error / quota / timeout / gateway error:</text>
  <text class="text" x="795" y="961">fallback explanation with aiGenerated=false</text>
  <text class="text" x="795" y="992">Count-then-call quota is not atomic for concurrency.</text>
  <rect class="box data" x="770" y="1050" width="560" height="125" rx="6"/>
  <text class="label" x="795" y="1084">Return mapping</text>
  <text class="text" x="795" y="1112">HTTP: matchScore + breakdown + tutorInfo</text>
  <text class="text" x="795" y="1136">Java facade: public summaries, no web DTOs</text>
  <text class="text" x="795" y="1160">Persistence/commit failure is not an AI fallback.</text>
  <text class="text" x="70" y="1211">No production outbox or durable event delivery. See transaction sequence for commit, rollback and outer caller semantics.</text>
</svg>
