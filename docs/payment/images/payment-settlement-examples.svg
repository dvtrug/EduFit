<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120">
<rect width="100%" height="100%" fill="white"/>
<text x="64" y="28" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#2563EB" dominant-baseline="text-before-edge">EDUFIT / PAYMENT / 05</text>
<text x="64" y="66" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#0F172A" dominant-baseline="text-before-edge">Ví dụ: giữ 200.000đ thì tiền đi đâu?</text>
<text x="64" y="120" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#475569" dominant-baseline="text-before-edge">Ví payer ban đầu 1.000.000đ; tutor ban đầu 0đ. S là số tiền thực tất toán, A = 200.000đ.</text>
<path d="M64 164H1616" stroke="#E2E8F0" stroke-width="2"/>
<rect x="64" y="200" width="1552" height="150" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="88" y="220" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#2563EB" dominant-baseline="text-before-edge">Sau khi cấp tiền cho buổi học</text>
<text x="88" y="268" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Payer available = 800.000đ; held = 200.000đ. Tổng quyền lợi vẫn 1.000.000đ, nhưng chỉ 800.000đ được dùng tiếp.</text>
<polyline points="840,353 840,400 304,400 304,466" fill="none" stroke="#64748B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="304.0,466.0 296.3,452.0 311.7,452.0" fill="#64748B"/>
<rect x="64" y="470" width="480" height="345" rx="18" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="88" y="490" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#047857" dominant-baseline="text-before-edge">Trả đủ S = 200.000đ</text>
<text x="88" y="538" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Fee = 20.000đ</text>
<text x="88" y="573" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Tutor nhận = 180.000đ</text>
<text x="88" y="608" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Hoàn payer = 0đ</text>
<text x="88" y="643" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Payer cuối = 800.000đ</text>
<polyline points="840,353 840,400 840,400 840,466" fill="none" stroke="#64748B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="840.0,466.0 832.3,452.0 847.7,452.0" fill="#64748B"/>
<rect x="600" y="470" width="480" height="345" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="624" y="490" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#7C3AED" dominant-baseline="text-before-edge">Trả một phần S = 150.000đ</text>
<text x="624" y="538" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Fee = 15.000đ</text>
<text x="624" y="573" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Tutor nhận = 135.000đ</text>
<text x="624" y="608" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Hoàn payer = 50.000đ</text>
<text x="624" y="643" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Payer cuối = 850.000đ</text>
<polyline points="840,353 840,400 1376,400 1376,466" fill="none" stroke="#64748B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1376.0,466.0 1368.3,452.0 1383.7,452.0" fill="#64748B"/>
<rect x="1136" y="470" width="480" height="345" rx="18" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
<text x="1160" y="490" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#B45309" dominant-baseline="text-before-edge">Không thu phí S = 0đ</text>
<text x="1160" y="538" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Fee = 0đ</text>
<text x="1160" y="573" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Tutor nhận = 0đ</text>
<text x="1160" y="608" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Hoàn payer = 200.000đ</text>
<text x="1160" y="643" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Payer cuối = 1.000.000đ</text>
<rect x="64" y="875" width="1552" height="140" rx="18" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<text x="88" y="895" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#475569" dominant-baseline="text-before-edge">Tất cả kết quả cuối đều giải phóng held của charge về 0đ</text>
<text x="88" y="943" font-family="Segoe UI, sans-serif" font-size="25" font-weight="400" fill="#334155" dominant-baseline="text-before-edge">Commission = floor(S × 1000 / 10000). Tiền hoàn quay lại đúng payer; chưa có bước chuyển ngân hàng trong sơ đồ này.</text>
<text x="64" y="1044" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#475569" dominant-baseline="text-before-edge">Commission ghi entry nền tảng (user_id null), chưa có ví Admin hoặc chức năng rút hoa hồng riêng.</text>
</svg>
