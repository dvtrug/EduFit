spring:
  datasource:
    url: jdbc:h2:mem:edufit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    create-schemas: true
    default-schema: edufit
    schemas: edufit
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: edufit
