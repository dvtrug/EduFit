server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 60m # NFR-04: Hết hạn sau 60 phút không hoạt động (sliding inactivity)
      cookie:
        name: EDUFIT_SESSION # Theo đặc tả authentication-contract.md
        http-only: true
        same-site: lax

spring:
  application:
    name: edufit-backend

  # 1. Kích hoạt Virtual Threads trên Java 21 & Spring Boot 4.x
  threads:
    virtual:
      enabled: true

  # 2. Cấu hình Cơ sở dữ liệu PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edufit}}
    username: ${DB_USERNAME:${DB_USER:edufit}}
    password: ${DB_PASSWORD:edufit-local-only}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: EduFitHikariPool
      # Đảm bảo PostgreSQL kết nối với múi giờ UTC (NFR-18), tránh lỗi TimeZone "Asia/Saigon"
      data-source-properties:
        options: "-c timezone=UTC"

  # 3. Cấu hình Mail Service (Mailpit cho môi trường local)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # 3. Cấu hình JPA / Hibernate 7
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Không cho hibernate tự ý tạo bảng, dùng Flyway
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  # 4. Quản lý Migration DB tập trung (ADR-002 Decision 3b)
  flyway:
    enabled: true
    locations: classpath:db/migration # Quét đệ quy toàn bộ thư mục con (iam, scheduling...)
    out-of-order: false # Ép thứ tự thời gian nghiêm ngặt, bắt lỗi version đặt sai ngay khi migrate
    validate-on-migrate: true # Kiểm tra checksum, migration đã áp dụng bị sửa -> build fail ngay
    baseline-on-migrate: true # Khởi tạo từ CSDL trắng, không baseline giả lập

# 5. Cấu hình AI Gateway (platform/ai)
edufit:
  discovery:
    matching:
      candidate-limit: ${DISCOVERY_MATCHING_CANDIDATE_LIMIT:200}
  ai:
    provider: ${AI_PROVIDER:stub} # 'stub' cho offline/test, 'gemini' cho gọi thật
    timeout: 15s                 # NFR-10: khống chế timeout 15 giây
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# 6. Cấu hình Swagger / OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# 6. Logging
logging:
  level:
    vn.edufit: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
