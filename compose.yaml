name: edufit

services:
  db:
    image: postgres:17
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: ${POSTGRES_DB:-edufit}
      POSTGRES_USER: ${POSTGRES_USER:-edufit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edufit-local-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-edufit}?options=-c%20timezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${POSTGRES_USER:-edufit}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-edufit-local-only}
      MAIL_HOST: mail
      MAIL_PORT: 1025
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-}
      PAYMENT_FRONTEND_URL: ${PAYMENT_FRONTEND_URL:-http://localhost:3000}
      PAYMENT_BANK_BIN: ${PAYMENT_BANK_BIN:-}
      PAYMENT_BANK_HOLDER: ${PAYMENT_BANK_HOLDER:-}
      PAYOS_PAYOUT_ENABLED: ${PAYOS_PAYOUT_ENABLED:-false}
      PAYOS_PAYOUT_CLIENT_ID: ${PAYOS_PAYOUT_CLIENT_ID:-}
      PAYOS_PAYOUT_API_KEY: ${PAYOS_PAYOUT_API_KEY:-}
      PAYOS_PAYOUT_CHECKSUM_KEY: ${PAYOS_PAYOUT_CHECKSUM_KEY:-}
      STORAGE_CREDENTIALS_ROOT: ${STORAGE_CREDENTIALS_ROOT:-/app/var/credentials}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - credential_data:/app/var/credentials
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  credential_data:
