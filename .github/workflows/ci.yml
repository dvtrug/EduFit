name: EduFit CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-quality-gate:
    name: "Frontend Quality Gate (Next.js & React)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - TypeScript Compiler Check (Zero Errors)
        run: npm run type-check

      - name: Gate 1 - ESLint Code Style & React Rules
        run: npm run lint

      - name: Gate 3 - Vitest Unit & Parameterized Schema Tests
        run: npm run test

  backend-quality-gate:
    name: "Backend Quality Gate (Spring Boot & Maven)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Gate 2 & 3 - Run Tests and Quality Gate (ArchUnit + JUnit + JaCoCo)
        run: ./mvnw clean verify
