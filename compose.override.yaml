name: edufit

services:
  db:
    # Tối ưu hóa I/O cho local development trên ổ ảo WSL2 (.vhdx)
    # Tắt fsync và synchronous_commit giúp tăng tốc ghi giao dịch gấp 100 lần
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      interval: 15s

  backend:
    environment:
      # Cấp phát 512MB RAM heap ngay từ đầu, tránh G1GC pauses do co giãn heap trên máy local
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    healthcheck:
      interval: 20s
